[project]
name = "rl_animal_torch"
version = "0.1.0"
description = "The Animal-AI Olympics winning agent, in PyTorch against the v4 environment"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
dependencies = [
    "animalai==5.0.1",
    # reads the .NET metadata of the player's assembly, for patch_env_logging
    "dnfile",
    "mlagents-envs==1.0.0",
    "numpy",
    "torch>=2.7",
    # The Animal-AI v4 stack forces protobuf 3.20.3 (see the override below). wandb ships
    # protobuf code generated per major version and dropped the 3.x generation after
    # 0.19.11: from 0.20 on it carries only v5/v6/v7, so with 3.20.3 the dispatch in
    # wandb/proto matches nothing and importing wandb fails.
    "wandb<=0.19.11",
]

[project.scripts]
train = "rl_animal_torch.train:main"
evaluate = "rl_animal_torch.evaluate:main"
patch_env_logging = "rl_animal_torch.patch_env_logging:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_animal_torch"]

[tool.uv]
# animalai pins protobuf==3.20.3 while mlagents-envs pins protobuf<3.20, which is
# unsatisfiable as written. 3.20.3 is what the Animal-AI v4 player was built against and
# what its own package asks for, so that is the one to force; it ships a pure-python
# wheel, so it installs on 3.12 even though its extension modules stop at 3.10.
override-dependencies = [
    "protobuf==3.20.3",
    "numpy>=1.26.4",
    "grpcio>=1.60",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["I", "F", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Animal-AI tests need the player binary, which is not part of the repository; they skip
# themselves unless AAI4_ENV_PATH points at it.
addopts = "-q"
