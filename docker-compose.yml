x-animal: &animal
  image: rl-animal:tf1.14-cuda10.0
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      USER_ID: "${USER_ID:-1000}"
      GROUP_ID: "${GROUP_ID:-1000}"
  working_dir: /workspace
  volumes:
    - .:/workspace
    # The 900 competition scenarios as released by the upstream animal-ai repository.
    # 869 of them are byte-identical to configs/learning/competition_configurations/;
    # the other 31 carry upstream fixes (!RGB tags that were written as !Vector3, a
    # dangling `positions:` key, one agent spawn height). Mounted read-only so that
    # either evaluation can be pointed at them without copying:
    #   --configs '/competition_configs/*.yaml'
    - "${COMPETITION_CONFIG_DIR:-/home/sakoda/work/vla_streaming_rl/external/animal-ai/configs/competition}:/competition_configs:ro"
  # ray's object store and the parallel Unity instances need a large /dev/shm
  shm_size: "8gb"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Interactive shell: docker compose run --rm animal
  animal:
    <<: *animal
    stdin_open: true
    tty: true
    command: ["bash"]

  # RTX 3090 (Ampere) 用: docker compose run --rm animal-ampere
  animal-ampere:
    <<: *animal
    image: rl-animal:tf1.15-ampere
    build:
      context: .
      dockerfile: docker/Dockerfile.ampere
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    stdin_open: true
    tty: true
    command: ["bash"]

  # Animal-AI v4 (Unity 6) のバイナリで評価する:
  #   AAI4_ENV_DIR=/path/to/animalai_env/Linux docker compose run --rm animal-aai4 \
  #     python aai4_eval.py --checkpoint nn/last84_10_5 --env-path /aai4/animalAI.x86_64 ...
  animal-aai4:
    <<: *animal
    image: rl-animal:tf1.15-ampere
    build:
      context: .
      dockerfile: docker/Dockerfile.ampere
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
    volumes:
      - .:/workspace
      - "${COMPETITION_CONFIG_DIR:-/home/sakoda/work/vla_streaming_rl/external/animal-ai/configs/competition}:/competition_configs:ro"
      - "${AAI4_ENV_DIR:-/home/sakoda/animalai_env/Linux}:/aai4"
    stdin_open: true
    tty: true
    command: ["bash"]

  # Notebooks (Player.ipynb / Validation.ipynb / test_a2c.ipynb):
  #   docker compose up jupyter  ->  http://localhost:8888
  jupyter:
    <<: *animal
    ports:
      - "8888:8888"
    command:
      - jupyter
      - notebook
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --NotebookApp.token=
      - --NotebookApp.password=

  # docker compose up tensorboard  ->  http://localhost:6006
  tensorboard:
    <<: *animal
    ports:
      - "6006:6006"
    command: ["tensorboard", "--logdir", "runs", "--host", "0.0.0.0", "--port", "6006"]
