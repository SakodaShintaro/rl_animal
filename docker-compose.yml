x-animal: &animal
  image: rl-animal:tf1.14-cuda10.0
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      USER_ID: "${USER_ID:-1000}"
      GROUP_ID: "${GROUP_ID:-1000}"
  working_dir: /workspace
  volumes:
    - .:/workspace
  # ray's object store and the parallel Unity instances need a large /dev/shm
  shm_size: "8gb"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Interactive shell: docker compose run --rm animal
  animal:
    <<: *animal
    stdin_open: true
    tty: true
    command: ["bash"]

  # Notebooks (Player.ipynb / Validation.ipynb / test_a2c.ipynb):
  #   docker compose up jupyter  ->  http://localhost:8888
  jupyter:
    <<: *animal
    ports:
      - "8888:8888"
    command:
      - jupyter
      - notebook
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --NotebookApp.token=
      - --NotebookApp.password=

  # docker compose up tensorboard  ->  http://localhost:6006
  tensorboard:
    <<: *animal
    ports:
      - "6006:6006"
    command: ["tensorboard", "--logdir", "runs", "--host", "0.0.0.0", "--port", "6006"]
